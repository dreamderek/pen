<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>iPad 手指／Apple Pencil 分流測試</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-drag: none;
  }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f5f8; color:#172033; }
  #app { height:100%; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); gap:10px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 2px 0; }
  h1 { font-size:17px; margin:0; }
  .sub { font-size:12px; color:#687386; margin-top:3px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  button { border:1px solid #cbd3df; background:white; color:#253047; padding:9px 12px; border-radius:10px; font-size:13px; }
  button:active { background:#e8edf5; }
  #status { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; }
  .stat { min-width:0; background:white; border:1px solid #e0e5ed; border-radius:10px; padding:8px 9px; }
  .stat small { display:block; color:#778195; font-size:11px; margin-bottom:3px; }
  .stat strong { display:block; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums; }
  #board { position:relative; flex:1; min-height:180px; overflow:hidden; border:1px solid #cbd3df; border-radius:14px; background-color:#fff; background-image:linear-gradient(#edf1f6 1px,transparent 1px),linear-gradient(90deg,#edf1f6 1px,transparent 1px); background-size:24px 24px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  img, svg { -webkit-user-drag:none; user-drag:none; }
  #hint { position:absolute; left:12px; bottom:10px; padding:7px 10px; border-radius:8px; background:rgba(255,255,255,.88); color:#667085; font-size:12px; pointer-events:none; }
  footer { display:flex; justify-content:space-between; gap:10px; color:#687386; font-size:12px; padding:0 2px 5px; }
  .pill { display:inline-block; padding:3px 7px; border-radius:99px; background:#edf1f6; color:#43506a; }
  @media(max-width:600px) {
    #status { grid-template-columns:repeat(2,minmax(0,1fr)); }
    header { align-items:flex-start; flex-direction:column; }
    .toolbar { width:100%; }
    button { flex:1; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>手指／Apple Pencil 分流測試</h1>
      <div class="sub">筆尖書寫・單指拖曳・雙指縮放</div>
    </div>
    <div class="toolbar">
      <button id="clear">清除筆跡</button>
      <button id="reset">重設畫面</button>
      <button id="toggle">手指模式：拖曳／縮放</button>
    </div>
  </header>

  <section id="status">
    <div class="stat"><small>輸入來源</small><strong id="source">尚未操作</strong></div>
    <div class="stat"><small>Pointer Type</small><strong id="type">—</strong></div>
    <div class="stat"><small>Pressure</small><strong id="pressure">—</strong></div>
    <div class="stat"><small>座標（畫布）</small><strong id="coords">—</strong></div>
  </section>

  <main id="board">
    <canvas id="canvas"></canvas>
    <div id="hint">請用 Apple Pencil 書寫；用手指拖曳或雙指縮放</div>
  </main>
  <footer>
    <span>縮放：<b id="zoom">100%</b></span>
    <span><span class="pill">Pencil = 書寫</span> <span class="pill">Finger = 操作</span></span>
  </footer>
</div>

<script>
(() => {
  // Avoid iPadOS text/image selection, callouts, and native dragging throughout
  // the app while leaving the canvas Pointer Events gestures intact.
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('selectstart', event => event.preventDefault());
  document.addEventListener('dragstart', event => event.preventDefault());

  const board = document.querySelector('#board');
  const canvas = document.querySelector('#canvas');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let view = { x: 0, y: 0, scale: 1 };
  let strokes = [];
  let activeStroke = null;
  let pointers = new Map();
  let gesture = null;
  let fingerMode = 'pan';

  function resize() {
    const rect = board.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    render();
  }

  function screenToWorld(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left - view.x) / view.scale,
      y: (clientY - r.top - view.y) / view.scale
    };
  }

  function render() {
    const rect = canvas.getBoundingClientRect();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.x, dpr * view.y);

    for (const stroke of strokes) {
      if (!stroke.points.length) continue;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = stroke.color;
      ctx.beginPath();
      ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for (let i = 1; i < stroke.points.length; i++) {
        const p = stroke.points[i];
        ctx.lineWidth = p.width;
        ctx.lineTo(p.x, p.y);
      }
      ctx.lineWidth = stroke.points[0].width;
      ctx.stroke();
      if (stroke.points.length === 1) {
        const p = stroke.points[0];
        ctx.fillStyle = stroke.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.7, p.width / 2), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    $('zoom').textContent = Math.round(view.scale * 100) + '%';
  }

  function addPenPoint(e) {
    const p = screenToWorld(e.clientX, e.clientY);
    const pressure = e.pressure > 0 ? e.pressure : 0.35;
    const width = 1.2 + pressure * 4.2;
    activeStroke.points.push({ x: p.x, y: p.y, width });
    render();
    $('pressure').textContent = Number(e.pressure).toFixed(3);
    $('coords').textContent = `${Math.round(p.x)}, ${Math.round(p.y)}`;
  }

  function midpoint(a, b) {
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });

    $('source').textContent = e.pointerType === 'pen' ? 'Apple Pencil／觸控筆' :
      e.pointerType === 'touch' ? '手指' : '滑鼠';
    $('type').textContent = e.pointerType;
    $('pressure').textContent = Number(e.pressure).toFixed(3);
    const p = screenToWorld(e.clientX, e.clientY);
    $('coords').textContent = `${Math.round(p.x)}, ${Math.round(p.y)}`;

    if (e.pointerType === 'pen') {
      activeStroke = { color: '#1769e0', points: [] };
      strokes.push(activeStroke);
      addPenPoint(e);
      return;
    }

    if (e.pointerType === 'touch') {
      if (fingerMode === 'disabled') return;
      if (pointers.size === 1) {
        gesture = { kind: 'pan', startX: e.clientX, startY: e.clientY, viewX: view.x, viewY: view.y };
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const mid = midpoint(pts[0], pts[1]);
        gesture = {
          kind: 'pinch',
          startDistance: distance(pts[0], pts[1]),
          startScale: view.scale,
          worldAtMid: screenToWorld(mid.x, mid.y),
          startMid: mid
        };
      }
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });

    if (e.pointerType === 'pen' && activeStroke && e.buttons !== 0) {
      const events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
      for (const sample of events) addPenPoint(sample);
      return;
    }

    if (e.pointerType === 'touch' && gesture && fingerMode === 'pan') {
      const pts = [...pointers.values()].filter(p => p.type === 'touch');
      if (pts.length >= 2) {
        const mid = midpoint(pts[0], pts[1]);
        const ratio = distance(pts[0], pts[1]) / Math.max(1, gesture.startDistance || distance(pts[0], pts[1]));
        const nextScale = Math.min(4, Math.max(0.35, gesture.startScale * ratio));
        view.scale = nextScale;
        view.x = mid.x - canvas.getBoundingClientRect().left - gesture.worldAtMid.x * nextScale;
        view.y = mid.y - canvas.getBoundingClientRect().top - gesture.worldAtMid.y * nextScale;
      } else if (pts.length === 1 && gesture.kind === 'pan') {
        view.x = gesture.viewX + e.clientX - gesture.startX;
        view.y = gesture.viewY + e.clientY - gesture.startY;
      }
      render();
    }
  });

  function finishPointer(e) {
    if (e.pointerType === 'pen') activeStroke = null;
    pointers.delete(e.pointerId);
    if (pointers.size === 0) gesture = null;
    else if ([...pointers.values()].filter(p => p.type === 'touch').length === 1) {
      const p = [...pointers.values()].find(p => p.type === 'touch');
      gesture = { kind: 'pan', startX: p.x, startY: p.y, viewX: view.x, viewY: view.y };
    }
  }
  canvas.addEventListener('pointerup', finishPointer);
  canvas.addEventListener('pointercancel', finishPointer);
  canvas.addEventListener('lostpointercapture', finishPointer);

  $('clear').addEventListener('click', () => { strokes = []; activeStroke = null; render(); });
  $('reset').addEventListener('click', () => { view = { x: 0, y: 0, scale: 1 }; render(); });
  $('toggle').addEventListener('click', () => {
    fingerMode = fingerMode === 'pan' ? 'disabled' : 'pan';
    $('toggle').textContent = fingerMode === 'pan' ? '手指模式：拖曳／縮放' : '手指模式：停用';
    canvas.style.pointerEvents = 'auto';
    canvas.dataset.fingerMode = fingerMode;
    $('hint').textContent = fingerMode === 'pan'
      ? '請用 Apple Pencil 書寫；用手指拖曳或雙指縮放'
      : '手指操作已停用；Apple Pencil 仍可書寫';
  });

  // ResizeObserver keeps the canvas aligned when the iPad changes orientation.
  new ResizeObserver(resize).observe(board);
  resize();
})();
</script>
</body>
</html>
